spring:
  application:
    name: streamforge-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:streamforge}
    username: ${POSTGRES_USER:streamforge}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: streamforge
    default-schema: streamforge
  mvc:
    problemdetails:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9094}
    admin:
      fail-fast: false
      auto-create: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 8000

streamforge:
  security:
    device-admin-api-key: ${DEVICE_ADMIN_API_KEY}
    ingestion-api-key: ${INGESTION_API_KEY}
  publication:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
    poll-delay-ms: ${OUTBOX_PUBLISHER_POLL_DELAY_MS:1000}
    batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:50}
    topic: ${OUTBOX_TOPIC:telemetry.reading.v1}
    send-timeout: ${OUTBOX_PUBLISHER_SEND_TIMEOUT:10s}

server:
  port: ${SERVER_PORT:8080}
  # Local development binds to loopback. Container or cloud deployments set SERVER_ADDRESS=0.0.0.0.
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    kafka:
      enabled: false
