name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Public production build
        run: npm run build
      - name: Public bundle isolation
        run: npm run check:public-bundle
      - name: Live production build
        run: npm run build:live
      - name: Live bundle check
        run: npm run check:live-bundle
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Public showcase browser tests
        run: npm run e2e:showcase
      - name: Audit
        run: npm audit --audit-level=high
